services:
  postgres:
    image: postgres:16-alpine
    container_name: mindmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindmate}
      POSTGRES_DB: ${POSTGRES_DB:-mindmate}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mindmate_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindmate}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mindmate_pgdata:
